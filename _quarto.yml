# Configuração comum às duas versões do site.
# O menu, o rodapé e os textos de cada idioma ficam em:
#   _quarto-pt.yml  (português, perfil padrão)  -> páginas na raiz
#   _quarto-en.yml  (inglês)                    -> páginas em en/
# Para gerar o site completo (as duas versões), rode:
#   ./render-site.sh
# Para ver só a versão em português enquanto edita: quarto preview

project:
  type: website
  output-dir: docs
  resources:
    - slides/*.pdf
    - posters/*.pdf

profile:
  default: pt

website:
  title: "Magno Tairone"
  site-url: https://magnotairone.github.io
  favicon: "img/profile-foto.png"
  image: "img/profile-foto.png"
  open-graph: true
  twitter-card: true
  sidebar: false

format:
  html:
    include-after-body: traffic.html
    theme:
      light: [cosmo, theme-light.scss, theme.scss]
      dark: [darkly, theme-dark.scss, theme.scss]
